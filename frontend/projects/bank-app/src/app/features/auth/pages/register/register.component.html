<app-auth-shell heading="Kayıt ol" subtitle="Birkaç bilgiyle hesabınızı oluşturun.">
  @if (error(); as message) {
    <app-notice class="mb-4" [message]="message" />
  }

  <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
    <div class="grid grid-cols-2 gap-3">
      <label class="field">
        <span class="field-label">Ad</span>
        <input class="input" formControlName="firstName" autocomplete="given-name" />
        @if (show('firstName')) {
          <span class="field-error">En az 2 karakter olmalıdır.</span>
        }
      </label>
      <label class="field">
        <span class="field-label">Soyad</span>
        <input class="input" formControlName="lastName" autocomplete="family-name" />
        @if (show('lastName')) {
          <span class="field-error">En az 2 karakter olmalıdır.</span>
        }
      </label>
    </div>

    <label class="field">
      <span class="field-label">T.C. Kimlik No</span>
      <input class="input" formControlName="tcNo" inputmode="numeric" maxlength="11" />
      @if (show('tcNo')) {
        <span class="field-error">11 haneli olmalıdır.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">E-posta</span>
      <input class="input" type="email" formControlName="email" autocomplete="email" />
      @if (show('email')) {
        <span class="field-error">Geçerli bir e-posta girin.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Telefon</span>
      <input class="input" type="tel" formControlName="phone" autocomplete="tel" placeholder="05xx xxx xx xx" />
      @if (show('phone')) {
        <span class="field-error">Telefon zorunludur.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Şifre</span>
      <input class="input" type="password" formControlName="password" autocomplete="new-password" />
      @if (show('password')) {
        <span class="field-error">En az 8 karakter olmalıdır.</span>
      }
    </label>

    <fieldset>
      <legend class="field-label mb-1.5">Üyelik tipi</legend>
      <div class="grid grid-cols-2 gap-2">
        @for (option of memberships; track option.value) {
          <button
            type="button"
            [class]="form.controls.membership.value === option.value ? 'btn-primary' : 'btn-secondary'"
            [attr.aria-pressed]="form.controls.membership.value === option.value"
            (click)="form.controls.membership.setValue(option.value)"
          >
            {{ option.label }}
          </button>
        }
      </div>
    </fieldset>

    <button type="submit" class="btn-primary w-full" [disabled]="busy()">
      {{ busy() ? 'Hesap oluşturuluyor...' : 'Kayıt ol' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-ink-soft">
    Zaten hesabınız var mı?
    <a routerLink="/auth/login" class="btn-link">Giriş yapın</a>
  </p>
</app-auth-shell>
