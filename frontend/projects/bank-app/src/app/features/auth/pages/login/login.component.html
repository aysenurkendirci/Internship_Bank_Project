<app-auth-shell heading="Giriş yap" subtitle="T.C. kimlik numaranız ve şifrenizle devam edin.">
  @if (notice(); as message) {
    <app-notice class="mb-4" kind="success" [message]="message" />
  }
  @if (error(); as message) {
    <app-notice class="mb-4" [message]="message" />
  }

  <form class="space-y-4" [formGroup]="form" (ngSubmit)="submit()">
    <label class="field">
      <span class="field-label">T.C. Kimlik No</span>
      <input class="input" formControlName="tcNo" inputmode="numeric" maxlength="11" autocomplete="username" />
      @if (form.controls.tcNo.touched && form.controls.tcNo.invalid) {
        <span class="field-error">T.C. kimlik numarası zorunludur.</span>
      }
    </label>

    <label class="field">
      <span class="field-label">Şifre</span>
      <input class="input" type="password" formControlName="password" autocomplete="current-password" />
      @if (form.controls.password.touched && form.controls.password.invalid) {
        <span class="field-error">Şifre zorunludur.</span>
      }
    </label>

    <button type="submit" class="btn-primary w-full" [disabled]="busy()">
      {{ busy() ? 'Giriş yapılıyor...' : 'Giriş yap' }}
    </button>
  </form>

  <p class="mt-6 text-sm text-ink-soft">
    Hesabınız yok mu?
    <a routerLink="/auth/register" class="btn-link">Kayıt olun</a>
  </p>
</app-auth-shell>
