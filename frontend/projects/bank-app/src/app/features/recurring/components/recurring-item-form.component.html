<form class="panel grid gap-4 sm:grid-cols-2 lg:grid-cols-4" [formGroup]="form" (ngSubmit)="submit()">
  <label class="field lg:col-span-2">
    <span class="field-label">Ad</span>
    <input class="input" formControlName="name" placeholder="Örn. Kira" />
    @if (form.controls.name.touched && form.controls.name.invalid) {
      <span class="field-error">Ad zorunludur.</span>
    }
  </label>
  <label class="field">
    <span class="field-label">Tür</span>
    <select class="input" formControlName="kind">
      @for (kind of kinds; track kind) {
        <option [value]="kind">{{ kindLabels[kind] }}</option>
      }
    </select>
  </label>
  <label class="field">
    <span class="field-label">Kategori</span>
    <input class="input" formControlName="category" placeholder="Örn. Konut" />
    @if (form.controls.category.touched && form.controls.category.invalid) {
      <span class="field-error">Kategori zorunludur.</span>
    }
  </label>
  <label class="field">
    <span class="field-label">Tutar</span>
    <input class="input" type="number" min="0" step="0.01" formControlName="amount" />
  </label>
  <label class="field">
    <span class="field-label">Para birimi</span>
    <select class="input" formControlName="currencyCode">
      <option value="TRY">TRY</option>
      <option value="USD">USD</option>
      <option value="EUR">EUR</option>
    </select>
  </label>
  <label class="field">
    <span class="field-label">Sıklık</span>
    <select class="input" formControlName="frequency">
      <option value="Weekly">Haftalık</option>
      <option value="Monthly">Aylık</option>
      <option value="Yearly">Yıllık</option>
    </select>
  </label>
  <label class="field">
    <span class="field-label">Her kaç dönemde bir</span>
    <input class="input" type="number" min="1" max="52" formControlName="interval" />
  </label>
  <label class="field">
    <span class="field-label">Başlangıç</span>
    <input class="input" type="date" formControlName="startDate" />
  </label>
  <label class="field">
    <span class="field-label">Bitiş (isteğe bağlı)</span>
    <input class="input" type="date" formControlName="endDate" />
  </label>
  @if (canUseCard()) {
    <label class="field lg:col-span-2">
      <span class="field-label">Ödeme kaynağı</span>
      <select class="input" formControlName="creditCardId">
        <option [ngValue]="0">Hesaptan (kendi tarihinde)</option>
        @for (card of cards(); track card.id) {
          <option [ngValue]="card.id">{{ card.name }} (son ödeme gününde)</option>
        }
      </select>
    </label>
  }
  <div class="flex items-end gap-2 lg:col-span-4">
    <button type="submit" class="btn-primary" [disabled]="busy()">{{ item() ? 'Güncelle' : 'Kaydet' }}</button>
    <button type="button" class="btn-secondary" (click)="cancel.emit()">Vazgeç</button>
  </div>
</form>
