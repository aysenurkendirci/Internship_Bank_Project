<form class="panel space-y-6" [formGroup]="form" (ngSubmit)="submit()">
  <div class="grid gap-4 sm:grid-cols-3">
    <label class="field">
      <span class="field-label">Kart</span>
      <select class="input" formControlName="creditCardId">
        @for (card of cards(); track card.id) {
          <option [ngValue]="card.id">{{ card.name }}</option>
        }
      </select>
    </label>
    <label class="field">
      <span class="field-label">Ne alacaksınız?</span>
      <input class="input" formControlName="description" placeholder="Örn. Dizüstü bilgisayar" />
      @if (form.controls.description.touched && form.controls.description.invalid) {
        <span class="field-error">Açıklama zorunludur.</span>
      }
    </label>
    <label class="field">
      <span class="field-label">Alışveriş tarihi</span>
      <input class="input" type="date" formControlName="purchaseDate" />
    </label>
  </div>

  <fieldset>
    <legend class="field-label mb-2">Seçenekler (taksit sayısı ve o seçenekteki toplam fiyat)</legend>
    <div formArrayName="options" class="space-y-2">
      @for (option of options.controls; track option; let i = $index) {
        <div class="flex flex-wrap items-end gap-3" [formGroupName]="i">
          <label class="field w-32">
            <span class="sr-only">Seçenek {{ i + 1 }} taksit sayısı</span>
            <input class="input" type="number" min="1" max="36" formControlName="installmentCount" />
          </label>
          <span class="pb-3 font-bold text-slate-500">taksit,</span>
          <label class="field w-44">
            <span class="sr-only">Seçenek {{ i + 1 }} toplam fiyat</span>
            <input class="input" type="number" min="0" step="0.01" formControlName="totalAmount" />
          </label>
          <span class="pb-3 font-bold text-slate-500">₺ toplam</span>
          @if (options.length > 1) {
            <button type="button" class="btn-link text-red-600 pb-3" (click)="removeOption(i)">Kaldır</button>
          }
        </div>
      }
    </div>
    <div class="flex flex-wrap gap-4 mt-3">
      <button type="button" class="btn-link" (click)="addOption()" [disabled]="options.length >= maxOptions">+ Seçenek ekle</button>
      <button type="button" class="btn-link" (click)="copyPriceToAll()">İlk fiyatı tüm seçeneklere kopyala</button>
    </div>
    <p class="text-xs font-semibold text-slate-400 mt-2">
      Satıcılar uzun vadede genellikle daha yüksek fiyat ister. Her seçenek için size söylenen toplam fiyatı girin.
    </p>
  </fieldset>

  <button type="submit" class="btn-primary" [disabled]="busy() || cards().length === 0">
    {{ busy() ? 'Hesaplanıyor...' : 'Karşılaştır' }}
  </button>
</form>
