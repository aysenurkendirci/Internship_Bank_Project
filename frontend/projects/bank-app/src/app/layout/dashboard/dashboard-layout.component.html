<div class="min-h-screen flex flex-col lg:flex-row">
  <aside class="bg-white border-b lg:border-b-0 lg:border-r border-slate-100 lg:w-72 lg:min-h-screen lg:p-8 p-4 flex lg:flex-col gap-4">
    <div class="flex items-center gap-3 lg:mb-10">
      <div class="bg-blue-600 p-2 rounded-xl text-white shadow-lg shadow-blue-200">
        <span class="material-symbols-outlined">bolt</span>
      </div>
      <span class="text-2xl font-black text-slate-900 tracking-tight hidden sm:inline">NeoBank</span>
    </div>

    <nav class="flex lg:flex-col gap-1 overflow-x-auto no-scrollbar flex-1" aria-label="Ana menü">
      @for (item of navItems; track item.path) {
        <a
          [routerLink]="item.path"
          routerLinkActive="bg-blue-50 text-blue-600"
          [routerLinkActiveOptions]="{ exact: item.path === '/dashboard' }"
          class="flex items-center gap-3 px-4 py-3 rounded-2xl font-bold text-slate-500 hover:bg-slate-50 whitespace-nowrap transition-colors"
        >
          <span class="material-symbols-outlined">{{ item.icon }}</span>
          <span>{{ item.label }}</span>
        </a>
      }
    </nav>

    <div class="flex lg:flex-col items-center lg:items-stretch gap-3 lg:mt-auto lg:pt-6 lg:border-t border-slate-100">
      @if (fullName(); as name) {
        <p class="text-sm font-bold text-slate-700 truncate hidden lg:block">{{ name }}</p>
      }
      <button
        type="button"
        (click)="exportMyData()"
        [disabled]="exporting()"
        class="flex items-center gap-2 px-4 py-3 rounded-2xl font-bold text-slate-500 hover:bg-slate-50 disabled:opacity-50"
        title="Hakkınızda tutulan bütün verileri JSON dosyası olarak indirir"
      >
        <span class="material-symbols-outlined">download</span>
        <span class="hidden sm:inline">{{ exporting() ? 'Hazırlanıyor...' : 'Verilerimi indir' }}</span>
      </button>
      <button
        type="button"
        (click)="logout()"
        class="flex items-center gap-2 px-4 py-3 rounded-2xl font-bold text-slate-500 hover:bg-slate-50"
      >
        <span class="material-symbols-outlined">logout</span>
        <span class="hidden sm:inline">Çıkış</span>
      </button>
    </div>
  </aside>

  <main class="flex-1 p-4 sm:p-6 lg:p-10 overflow-y-auto">
    <div class="max-w-6xl mx-auto">
      <router-outlet />
    </div>
  </main>
</div>
